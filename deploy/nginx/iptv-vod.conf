# Host variant: nginx on the VPS in front of the Docker container, which serves the console
# and the relay on 127.0.0.1:8787 (BIND_HOST / IPTV_HOST_PORT in .env).
# Install as /etc/nginx/conf.d/iptv-vod.conf and replace example.com with your domain.
limit_req_zone $binary_remote_addr zone=iptv_admin:1m rate=1r/s;

map $uri $iptv_log {
    ~^/(channels|health)/?$ 1;
    ~^/[^/.]+/?$ 0;
    default      1;
}

upstream iptv_relay {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    access_log /var/log/nginx/iptv-vod.access.log combined if=$iptv_log;

    # Certificate renewal over HTTP (certbot webroot). Create the folder first:
    #   sudo mkdir -p /var/www/certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Players: the playlist and its streams.
    location ~ ^/(list\.m3u|live/|segment/|channels$|health$) {
        proxy_pass http://iptv_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Everything else (the console, the administrator key) goes to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name example.com;

    ssl_certificate     /etc/nginx/ssl/example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:iptv_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/iptv-vod.access.log combined if=$iptv_log;

    gzip on;
    gzip_types text/css application/javascript application/json application/vnd.apple.mpegurl;

    # Administrator-key check: rate limited here, locked out by the relay.
    location = /admin/verify {
        limit_req zone=iptv_admin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://iptv_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Everything else (console and relay routes) is served by the container.
    location / {
        proxy_pass http://iptv_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
