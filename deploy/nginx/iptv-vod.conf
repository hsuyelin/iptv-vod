# Host variant: nginx on the same machine as the relay (127.0.0.1:8787).
# Install as /etc/nginx/conf.d/iptv-vod.conf and set `root` to the built console
# (`dist/web` after scripts/build.sh).
# At most one administrator-key check per second per client, with a small burst. The relay
# applies its own, stricter lock-out; this keeps a flood from reaching it at all.
limit_req_zone $binary_remote_addr zone=iptv_admin:1m rate=1r/s;

# A console address with the key in it (/<key>) must not be written to the access log.
map $uri $iptv_log {
    ~^/(channels|health)/?$ 1;
    ~^/[^/.]+/?$ 0;
    default      1;
}

upstream iptv_relay {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/iptv-vod.access.log combined if=$iptv_log;

    root /srv/iptv-vod/web;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/vnd.apple.mpegurl;

    # Administrator-key check: rate limited here, locked out by the relay.
    location = /admin/verify {
        limit_req zone=iptv_admin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://iptv_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    # Relay routes. Playlists must never be cached; segments are fetched once.
    location ~ ^/(list\.m3u|live/|segment/|channels$|health$) {
        proxy_pass http://iptv_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # Hashed build assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
