# Host variant: nginx on the same machine as the relay (127.0.0.1:8787).
# Install as /etc/nginx/conf.d/iptv-vod.conf and set `root` to the built console
# (`dist/web` after scripts/build.sh).
# At most one administrator-key check per second per client, with a small burst. The relay
# applies its own, stricter lock-out; this keeps a flood from reaching it at all.
limit_req_zone $binary_remote_addr zone=iptv_admin:1m rate=1r/s;

# A console address with the key in it (/<key>) must not be written to the access log.
map $uri $iptv_log {
    ~^/(channels|health)/?$ 1;
    ~^/[^/.]+/?$ 0;
    default      1;
}

# Plain HTTP is for players only: the playlist and its streams. Everything a browser uses,
# which includes the administrator key, is sent on to HTTPS. Certificate renewal over HTTP
# (the ACME challenge) is left alone. Delete the `if` in the server block to serve both.
map "$scheme:$uri" $iptv_to_https {
    default                                              0;
    "~^http:/\.well-known/acme-challenge/"               0;
    "~^http:/(list\.m3u|live/|segment/|channels$|health$)" 0;
    "~^http:"                                            1;
}

upstream iptv_relay {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # HTTPS. Point these at your certificate, for example one from Let's Encrypt
    # (`certbot certonly --webroot -w /srv/iptv-vod/web -d example.com`), and set
    # `server_name` above to the same name. nginx 1.25.1 and later prefer `http2 on;` here
    # to the `http2` flag on `listen`.
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:iptv_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    if ($iptv_to_https) {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/iptv-vod.access.log combined if=$iptv_log;

    root /srv/iptv-vod/web;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/vnd.apple.mpegurl;

    # Administrator-key check: rate limited here, locked out by the relay.
    location = /admin/verify {
        limit_req zone=iptv_admin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://iptv_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    # Relay routes. Playlists must never be cached; segments are fetched once.
    location ~ ^/(list\.m3u|live/|segment/|channels$|health$) {
        proxy_pass http://iptv_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # Hashed build assets. `^~` keeps the file rules below from taking them over.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The console's address, and one word after it (/<key>): always the console, which
    # decides what the word means.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location ~ ^/[^/.]+/?$ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # A file name: the file, or a plain 404.
    location ~ \.[^/]+$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Anything else is not a page: the console again, with status 404, which shows its
    # own "page not found".
    location / {
        add_header Cache-Control "no-cache";
        error_page 404 /index.html;
        try_files $uri =404;
    }
}
