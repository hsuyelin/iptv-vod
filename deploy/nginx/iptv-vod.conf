# Host variant: nginx on the same machine as the relay (127.0.0.1:8787).
# Install as /etc/nginx/conf.d/iptv-vod.conf and set `root` to the built console
# (`dist/web` after scripts/build.sh). Needs nginx 1.25.1 or later (`http2 on;`).
#
# Port 80 is for players and certificate renewal only: the playlist and its streams are served
# as they are, the ACME challenge is left alone, and everything a browser uses (the console and
# the administrator key) is sent on to HTTPS. Port 443 serves everything.

# At most one administrator-key check per second per client, with a small burst. The relay
# applies its own, stricter lock-out; this keeps a flood from reaching it at all.
limit_req_zone $binary_remote_addr zone=iptv_admin:1m rate=1r/s;

# A console address with the key in it (/<key>) must not be written to the access log.
map $uri $iptv_log {
    ~^/(channels|health)/?$ 1;
    ~^/[^/.]+/?$ 0;
    default      1;
}

# Cache policy by address, sent from one place. (An `add_header` inside a location would
# replace the server-level ones, HSTS included.) Playlists must never be cached; segments are
# fetched once; hashed build assets never change, but only a real file may be remembered so.
map "$status:$uri" $iptv_cache {
    default                                                      "no-cache";
    "~^[0-9]+:/admin/verify$"                                    "no-store";
    "~^[0-9]+:/(list\.m3u|live/|segment/|channels$|health$)"     "no-store";
    "~^(200|304):/assets/"                                       "public, max-age=31536000, immutable";
}

upstream iptv_relay {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    access_log /var/log/nginx/iptv-vod.access.log combined if=$iptv_log;

    # Certificate renewal over HTTP (set `root` to the webroot given to certbot).
    location ^~ /.well-known/acme-challenge/ {
        root /srv/iptv-vod/web;
        try_files $uri =404;
    }

    # Players: the playlist and its streams.
    location ~ ^/(list\.m3u|live/|segment/|channels$|health$) {
        proxy_pass http://iptv_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        add_header Cache-Control $iptv_cache always;
    }

    # Everything else, the console and the administrator key included, moves to HTTPS.
    # To serve browsers over plain HTTP as well, replace this with the console locations
    # of the server below.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # HTTPS. Point these at your certificate, for example one from Let's Encrypt
    # (`certbot certonly --webroot -w /srv/iptv-vod/web -d example.com`), and set
    # `server_name` above to the same name.
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:iptv_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control $iptv_cache always;

    access_log /var/log/nginx/iptv-vod.access.log combined if=$iptv_log;

    root /srv/iptv-vod/web;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/vnd.apple.mpegurl;

    # Administrator-key check: rate limited here, locked out by the relay.
    location = /admin/verify {
        limit_req zone=iptv_admin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://iptv_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Relay routes.
    location ~ ^/(list\.m3u|live/|segment/|channels$|health$) {
        proxy_pass http://iptv_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Hashed build assets. `^~` keeps the file rules below from taking them over.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # The console's address, and one word after it (/<key>): always the console, which
    # decides what the word means.
    location = / {
        try_files /index.html =404;
    }

    location ~ ^/[^/.]+/?$ {
        try_files /index.html =404;
    }

    # A file name: the file, or a plain 404.
    location ~ \.[^/]+$ {
        try_files $uri =404;
    }

    # Anything else is not a page: the console again, with status 404, which shows its
    # own "page not found".
    location / {
        error_page 404 /index.html;
        try_files $uri =404;
    }
}
