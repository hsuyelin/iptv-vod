name: Build binaries

# Builds the relay with the console for Linux and macOS on amd64 and arm64, one job per
# platform, then gathers the packages into a GitHub release.
on:
  push:
    tags: ["v*"]

env:
  RETENTION_DAYS: 60
  RUST_VERSION: 1.96.0
  NODE_VERSION: 24

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: submodules/iptv-web/package-lock.json
      - run: npm ci && npm run build
        working-directory: submodules/iptv-web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: submodules/iptv-web/dist
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error

  relay:
    name: Relay ${{ matrix.name }}
    needs: web
    runs-on: ${{ matrix.runner }}
    # Linux builds run on Debian 12 so the binaries need glibc 2.36 at most.
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, runner: ubuntu-latest, image: "rust:1.96-bookworm" }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, image: "rust:1.96-bookworm" }
          - { name: macos-arm64, runner: macos-latest, image: "" }
          - { name: macos-amd64, runner: macos-15-intel, image: "" }
    env:
      # Use the installed toolchain instead of the `stable` channel in rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: 1.96.0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        if: matrix.image == ''
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: submodules/iptv-rs
          key: ${{ matrix.name }}
      - name: Build
        run: cargo build --release --locked -p iptv-server
        working-directory: submodules/iptv-rs
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: package/web
      - name: Package
        id: package
        shell: bash
        run: |
          name="iptv-vod-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "package/assets"
          cp submodules/iptv-rs/target/release/iptv-rs package/
          cp -r submodules/iptv-rs/assets/. package/assets/
          cp channels.yaml package/
          mv package "$name"
          tar -czf "$name.tar.gz" "$name"
          echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-vod-${{ matrix.name }}
          path: ${{ steps.package.outputs.file }}
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error

  release:
    name: Release
    needs: relay
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iptv-vod-*
          path: packages
          merge-multiple: true
      - name: Checksums
        working-directory: packages
        run: sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
