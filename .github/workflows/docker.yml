name: Docker

# Builds the image natively on an amd64 and an arm64 runner at the same time, pushes each
# by digest, then joins the digests into one multi-architecture tag on Docker Hub.
#
# Repository settings:
#   secrets DOCKER_USERNAME, DOCKER_PASSWORD (an access token is recommended)
#   DOCKER_IMAGENAME as a variable or a secret; the image is <DOCKER_USERNAME>/<DOCKER_IMAGENAME>
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Extra tag to publish, besides the commit hash
        type: string
        default: edge
      push:
        description: Push the image to Docker Hub
        type: boolean
        default: true
      retention-days:
        description: Days to keep the build artifacts
        type: number
        default: 60
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false
      DOCKER_IMAGENAME:
        required: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  DOCKER_IMAGENAME: ${{ vars.DOCKER_IMAGENAME || secrets.DOCKER_IMAGENAME }}
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/${{ vars.DOCKER_IMAGENAME || secrets.DOCKER_IMAGENAME }}
  # A tag push always publishes; a manual run publishes when asked to.
  PUSH: ${{ github.event_name == 'push' || inputs.push == true }}
  RETENTION_DAYS: ${{ inputs.retention-days || 60 }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Check the Docker Hub settings
        if: env.PUSH == 'true'
        run: |
          for name in DOCKER_USERNAME DOCKER_PASSWORD DOCKER_IMAGENAME; do
            [ -n "${!name}" ] || { echo "::error::$name is not set"; exit 1; }
          done
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: all
          platforms: ${{ matrix.platform }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: ${{ env.PUSH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
      - name: Keep the digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: env.PUSH == 'true'
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error

  merge:
    name: Publish
    needs: build
    if: github.event_name == 'push' || inputs.push == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha
      - name: Join the digests
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Check
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
