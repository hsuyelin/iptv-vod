schema: spec-driven

context: |
  Repository rules live in .agents/AGENTS.md (reply in Chinese; Rust comments, rustdoc and
  commit messages in English; commits only via the conventional-commit skill; verification
  gates: fmt, clippy -D warnings, test, doc, all with --workspace --frozen).
  The EMS-specific "Backend Contracts" in AGENTS.md (redb, accounts, Emby, Swagger) do NOT
  apply to this IPTV relay; only the generic Rust Quality rules do.
  Naming rule: no identifier, module, file, or doc term may use the Service Locator
  vocabulary: resolver, resolve*, provider, locator, registry, container. Dependencies are
  passed explicitly through constructors.
  Third-party IPTV players consume /list.m3u, /live/{ch}.m3u8, /segment/{ch}/{id}.ts,
  /channels, /health: these routes are a frozen public contract.

rules:
  tasks:
    - Every task group lands its own tests; benchmarks land with the code they measure.
    - Do not start coding before `openspec validate` passes for the change.
