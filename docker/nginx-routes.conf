# The locations both servers of default.conf (port 80 and port 443) share.

# Administrator-key check: rate limited here, locked out by the relay.
location = /admin/verify {
    limit_req zone=iptv_admin burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://iptv_relay;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# Relay routes.
location ~ ^/(list\.m3u|live/|segment/|channels$|health$) {
    proxy_pass http://iptv_relay;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
}

# Hashed build assets. `^~` keeps the file rules below from taking them over.
location ^~ /assets/ {
    try_files $uri =404;
}

# The console's address, and one word after it (/<key>): always the console, which
# decides what the word means.
location = / {
    try_files /index.html =404;
}

location ~ ^/[^/.]+/?$ {
    try_files /index.html =404;
}

# A file name: the file, or a plain 404.
location ~ \.[^/]+$ {
    try_files $uri =404;
}

# Anything else is not a page: the console again, with status 404, which shows its
# own "page not found".
location / {
    error_page 404 /index.html;
    try_files $uri =404;
}
