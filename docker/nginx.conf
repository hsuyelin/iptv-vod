# Container variant: the relay is reachable as `relay:8787` on the compose network.
# At most one administrator-key check per second per client, with a small burst. The relay
# applies its own, stricter lock-out; this keeps a flood from reaching it at all.
limit_req_zone $binary_remote_addr zone=iptv_admin:1m rate=1r/s;

# A console address with the key in it (/<key>) must not be written to the access log.
map $uri $iptv_log {
    ~^/(channels|health)/?$ 1;
    ~^/[^/.]+/?$ 0;
    default      1;
}

# Cache policy by address, sent from one place. (An `add_header` inside a location would
# replace the server-level ones, HSTS included.) Playlists must never be cached; segments are
# fetched once; hashed build assets never change, but only a real file may be remembered so.
map "$status:$uri" $iptv_cache {
    default                                                      "no-cache";
    "~^[0-9]+:/admin/verify$"                                    "no-store";
    "~^[0-9]+:/(list\.m3u|live/|segment/|channels$|health$)"     "no-store";
    "~^(200|304):/assets/"                                       "public, max-age=31536000, immutable";
}

upstream iptv_relay {
    server relay:8787;
    keepalive 16;
}

# Port 80: plain HTTP. The published ports are not 80 and 443 here, so nothing is redirected.
# To send browsers to HTTPS when the container is published on the standard ports, put
#     location / { return 301 https://$host$request_uri; }
# in place of the include, keeping the relay routes above it for players.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    add_header Cache-Control $iptv_cache always;
    access_log /dev/stdout combined if=$iptv_log;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/vnd.apple.mpegurl;

    include /etc/nginx/iptv-routes.conf;
}

# Port 443: HTTPS. The certificate and its key are mounted at these paths
# (docker-compose.build.yml mounts ./certs; scripts/self-signed-cert.sh makes a throw-away
# pair for trying it out). `X-Forwarded-Proto` tells the relay which scheme the client used,
# so the segment addresses it writes follow suit.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:iptv_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control $iptv_cache always;
    access_log /dev/stdout combined if=$iptv_log;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/vnd.apple.mpegurl;

    include /etc/nginx/iptv-routes.conf;
}
