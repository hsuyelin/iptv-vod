# Container variant: the relay is reachable as `relay:8787` on the compose network.
# At most one administrator-key check per second per client, with a small burst. The relay
# applies its own, stricter lock-out; this keeps a flood from reaching it at all.
limit_req_zone $binary_remote_addr zone=iptv_admin:1m rate=1r/s;

# A console address with the key in it (/<key>) must not be written to the access log.
map $uri $iptv_log {
    ~^/(channels|health)/?$ 1;
    ~^/[^/.]+/?$ 0;
    default      1;
}

upstream iptv_relay {
    server relay:8787;
    keepalive 16;
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name _;

    # HTTPS. The certificate and its key are mounted at these paths (docker-compose.build.yml
    # mounts ./certs; scripts/self-signed-cert.sh makes a throw-away pair for trying it out).
    # `X-Forwarded-Proto` below tells the relay which scheme the client used, so the segment
    # addresses it writes follow suit.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:iptv_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # The published ports are not 80 and 443 here, so plain HTTP stays served as it is. To
    # send browsers to HTTPS when the container is published on the standard ports, add
    #     if ($scheme = http) { return 301 https://$host$request_uri; }
    # at this level.

    access_log /dev/stdout combined if=$iptv_log;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/vnd.apple.mpegurl;

    # Administrator-key check: rate limited here, locked out by the relay.
    location = /admin/verify {
        limit_req zone=iptv_admin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://iptv_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    # Relay routes. Playlists must never be cached; segments are fetched once.
    location ~ ^/(list\.m3u|live/|segment/|channels$|health$) {
        proxy_pass http://iptv_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # Hashed build assets. `^~` keeps the file rules below from taking them over.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The console's address, and one word after it (/<key>): always the console, which
    # decides what the word means.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location ~ ^/[^/.]+/?$ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # A file name: the file, or a plain 404.
    location ~ \.[^/]+$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Anything else is not a page: the console again, with status 404, which shows its
    # own "page not found".
    location / {
        add_header Cache-Control "no-cache";
        error_page 404 /index.html;
        try_files $uri =404;
    }
}
