# docker compose -f docker-compose.build.yml --profile single up -d --build   # relay + console on :8787
# docker compose -f docker-compose.build.yml --profile split  up -d --build   # nginx on :8080 (HTTP) and :8443 (HTTPS) in front of the relay
# The split profile needs ./certs/fullchain.pem and ./certs/privkey.pem; run scripts/self-signed-cert.sh for a test pair.
# The images offer the lighter stream for old Apple devices; IPTV_COMPAT=off switches it off.
# Set IPTV_ADMIN_KEY (12+ letters, digits, - or _) to choose the administrator key; without it
# the relay generates one and prints it to its log (docker compose logs).
x-channels: &channels ./channels.yaml:/app/channels.yaml:ro

services:
  iptv:
    profiles: [single]
    build: { context: ., target: all }
    image: iptv-vod
    ports: ["${PORT:-8787}:8787"]
    volumes: [*channels]
    environment:
      IPTV_ADMIN_KEY: ${IPTV_ADMIN_KEY:-}
      IPTV_COMPAT: ${IPTV_COMPAT:-on}
    restart: unless-stopped

  relay:
    profiles: [split]
    build: { context: ., target: relay }
    image: iptv-vod-relay
    expose: ["8787"]
    volumes: [*channels]
    environment:
      IPTV_ADMIN_KEY: ${IPTV_ADMIN_KEY:-}
      IPTV_COMPAT: ${IPTV_COMPAT:-on}
    restart: unless-stopped

  web:
    profiles: [split]
    build: { context: ., target: web }
    image: iptv-vod-web
    ports: ["${WEB_PORT:-8080}:80", "${WEB_HTTPS_PORT:-8443}:443"]
    volumes: ["./certs:/etc/nginx/certs:ro"]
    depends_on: [relay]
    restart: unless-stopped
